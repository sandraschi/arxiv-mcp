[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-mcp"
version = "0.7.1"
description = "arXiv and DOI research for agents: search, full text, RAG, epistemic profiling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "arxiv>=2.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "prefab-ui>=0.14.0",
    "pypdf>=6.11.0",
    "defusedxml>=0.7.1",
    "pandas>=3.0.3",
    "lancedb>=0.30",
    "fastembed>=0.4.0",
    "pyarrow>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/arxiv-mcp"
Repository = "https://github.com/sandraschi/arxiv-mcp"
Issues = "https://github.com/sandraschi/arxiv-mcp/issues"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0,<0.17",
    "ty>=0.0.24",
]
rag = [
    "lancedb>=0.4.0",
    "fastembed>=0.4.0",
    "pyarrow>=15.0.0",
    "pylance>=0.15.0",
]
apps = [
    "prefab-ui>=0.14.0",
]
inspect = [
    "PyMuPDF>=1.25.0",
]

[project.scripts]
arxiv-mcp = "arxiv_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=src/arxiv_mcp", "--cov-report=term-missing", "--cov-fail-under=45"]

[tool.coverage.run]
source = ["src/arxiv_mcp"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF", "T20"]
ignore = ["S101", "B008", "S106", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# CLI entry modules print to stdout/stderr by design (never import these for server use)
"src/arxiv_mcp/check_invisible_text.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pyinstaller>=6.22.2",
    "pyright>=1.1",
    "pytesseract>=0.3.13",
    "pytest-cov>=7.1.0",
    "pywin32>=311",
    "pywinauto>=0.6.9",
    "respx>=0.23.1",
]
